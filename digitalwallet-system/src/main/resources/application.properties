spring.application.name=digitalwallet-system

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/digitalwallet_db?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET SESSION time_zone = '+00:00', innodb_lock_wait_timeout = 2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# C05: fresh persistence context per attempt; no request-scoped cached wallet/bank snapshots.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway is the only schema owner. Existing Phase 1 databases must be verified
# and explicitly baselined at V1; automatic baselining is intentionally unsafe.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# JWT Configuration. Production/deployment must provide APP_JWT_SECRET; there is intentionally no fallback.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Exclude default Spring Security UserDetailsService auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# C09-B management listener: loopback-only by default and never routed through public ingress.
management.server.port=${MANAGEMENT_SERVER_PORT:9091}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.worker.include=outboxWorker
management.endpoint.health.group.worker.show-details=when_authorized

# Aggregatable server-side buckets; p50/p95/p99 are calculated by the metrics backend.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s

# The real C07-B worker owns this switch. Until that implementation exists, health reports DISABLED.
app.outbox.worker.enabled=${APP_OUTBOX_WORKER_ENABLED:false}
app.outbox.worker.poll-interval=${APP_OUTBOX_WORKER_POLL_INTERVAL:1s}
app.outbox.worker.health-stale-after=${APP_OUTBOX_WORKER_HEALTH_STALE_AFTER:10s}
app.outbox.worker.health-startup-grace=${APP_OUTBOX_WORKER_HEALTH_STARTUP_GRACE:15s}

# Outbox gauges are refreshed off-scrape through an isolated one-connection pool.
app.observability.outbox.collection-interval=${APP_OUTBOX_METRICS_COLLECTION_INTERVAL:5s}
app.observability.outbox.collection-deadline=${APP_OUTBOX_METRICS_COLLECTION_DEADLINE:1500ms}
# One expected Prometheus scrape interval; older successful samples export NaN.
app.observability.outbox.freshness-ttl=${APP_OUTBOX_METRICS_FRESHNESS_TTL:15s}

# Named MDC fields are present in human-readable logs; deployment may replace the encoder with JSON.
logging.pattern.level=%5p correlationId=%X{correlationId:-} traceId=%X{traceId:-}
