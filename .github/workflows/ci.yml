name: Phase 2 CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: digitalwallet_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/digitalwallet_ci?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_password_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_JWT_SECRET: ci-test-only-key-not-for-any-deployment-0123456789abcdef
      APP_JWT_EXPIRATION_MS: '3600000'
    defaults:
      run:
        working-directory: digitalwallet-system
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Initialize isolated Phase 1 schema
        working-directory: .
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pci_root_only digitalwallet_ci < digitalwallet-database/digitalwallet_p1.sql
      - name: Build and run all tests
        run: bash ./gradlew clean build --no-daemon --stacktrace
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            digitalwallet-system/build/reports/tests/
            digitalwallet-system/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: backend-application-${{ github.run_id }}-${{ github.run_attempt }}
          path: digitalwallet-system/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
